name: Export Source ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source ZIP
        run: zip -r site_Kari-source.zip . -x '.git/*' -x 'node_modules/*' -x '.next/*' -x '.wrangler/*'
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: site_Kari-source
          path: site_Kari-source.zip
          retention-days: 7
